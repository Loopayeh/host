<html manifest="700.manifest">
<head>
	<meta charset='utf-8'>
    <script>history.replaceState(null,null,'cache700.html');</script>
    <title>PS4 Jailbreak · caching</title>
<style>
    :root{--txt:#f1f3f8;--mut:#9aa3b5;--acc:#91c8f6}
    *{box-sizing:border-box;margin:0;padding:0}
    body{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px 16px;
        background:radial-gradient(1200px 620px at 50% -10%, #26303f 0%, #0f0f12 62%);
        color:var(--txt);font:16px/1.6 system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;direction:rtl}
    .card{width:100%;max-width:520px;border-radius:22px;padding:26px 22px;text-align:center;
        background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);
        -webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);
        box-shadow:0 24px 70px rgba(0,0,0,.5)}
    h1{font-size:20px;font-weight:600}
    .sub{color:var(--mut);font-size:13px;margin:4px 0 22px}
    #progress{font-size:17px;font-weight:600;margin-bottom:16px;min-height:26px}
    .progress-wrapper{background:rgba(0,0,0,.35);border:1px solid rgba(255,255,255,.1);
        border-radius:14px;padding:4px}
    .progress-bar{position:relative;height:44px;border-radius:10px;overflow:hidden;background:rgba(0,0,0,.25)}
    .progress-fill{height:100%;width:0%;border-radius:10px;transition:width .3s ease;
        background:linear-gradient(90deg,rgba(145,200,246,.5),rgba(145,200,246,.85))}
    .progress-text{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
        font-size:15px;font-weight:700;color:#fff;z-index:3}
    .status-message{color:var(--mut);font-size:13px;margin-top:16px}
</style>
</head>
<body>
<div class="card">
    <h1>PS4 Jailbreak</h1>
    <p class="sub">Firmware 5.05 &ndash; 13.52 &middot; installing cache</p>
    <div id=msgs>
        <div id="progress">درحال بارگذاری... لطفا صبر کنید</div>
        <div class="progress-wrapper">
            <div class="progress-bar" id="myProgress">
                <div class="progress-fill" id="myBar"></div>
                <div class="progress-text" id="progressText">0%</div>
            </div>
        </div>
        <div class="status-message">درحال نصب کش...</div>
    </div>
</div>

<script>
if(window.applicationCache.status==2){localStorage.is755BCached=true;}
window.applicationCache.ondownloading=function(){
    document.getElementById("progress").innerHTML="آغاز نصب کردن کش";
    localStorage.is755BCached=false;
};
window.applicationCache.onprogress=function(a){
    const progress = Math.round(100*(a.loaded/a.total));
    document.getElementById("myBar").style.width = progress + "%";
    document.getElementById("progressText").innerHTML = progress + "%";
};
window.applicationCache.oncached=function(){
    document.getElementById("progress").innerHTML="کش با موفقیت نصب شد";
    localStorage.is755BCached=true;
    setTimeout(function(){window.location.reload("myBar"); }, 1500);
};
window.applicationCache.onupdateready=function(){
    document.getElementById("progress").innerHTML="کش با موفقیت آپدیت شد";
    localStorage.is755BCached=true;
    setTimeout(function(){window.location.reload("myBar"); }, 1500);
};
window.applicationCache.onnoupdate=function(){window.location.replace("index.html");};
window.applicationCache.onerror=function(){window.location.replace("cache700.html");};

// Fallback progress animation
var width = 0;
function frame1() {
    var elem = document.getElementById("myBar");
    var text = document.getElementById("progressText");
    var i=0;
    var id = setInterval(fra, 10);
    function fra(){
        if(i<10 && width<100){
            width++;
            elem.style.width = width + "%";
            text.innerHTML = width + "%";
        } 
        i++;
    }
}
</script>

</body>
</html>
