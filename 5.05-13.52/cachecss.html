<html manifest="css.manifest">
<head>
	<meta charset='utf-8'>
    <script>history.replaceState(null,null,'cachecss.html');</script>
    <title>PS4 Jailbreak · Cache</title>
<style>
    :root{--txt:#f2f5fb;--mut:#98a2b6;--acc:#7cc2ff;--acc2:#b693f1;--bad:#f58b8b;
        --glass:linear-gradient(150deg,rgba(255,255,255,.11),rgba(255,255,255,.035));
        --stroke:rgba(255,255,255,.14)}
    *{box-sizing:border-box;margin:0;padding:0}
    html,body{height:100%}
    body{position:relative;overflow:hidden;min-height:100vh;display:flex;align-items:center;justify-content:center;
        padding:26px 16px;background:#08080c;color:var(--txt);
        font:16px/1.6 system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif}
    .aurora{position:fixed;inset:0;z-index:0;pointer-events:none;
        background:
            radial-gradient(620px 420px at 12% -6%, rgba(79,142,247,.42), transparent 62%),
            radial-gradient(560px 460px at 92% 108%, rgba(139,92,246,.38), transparent 62%),
            radial-gradient(520px 520px at 78% 6%, rgba(56,189,248,.20), transparent 60%),
            radial-gradient(500px 500px at 6% 96%, rgba(236,72,153,.16), transparent 60%)}
    .grid{position:fixed;inset:0;z-index:0;pointer-events:none;opacity:.35;
        background-image:linear-gradient(rgba(255,255,255,.05) 1px,transparent 1px),
                         linear-gradient(90deg,rgba(255,255,255,.05) 1px,transparent 1px);
        background-size:44px 44px;
        -webkit-mask-image:radial-gradient(circle at 50% 40%,#000 0%,transparent 78%);
        mask-image:radial-gradient(circle at 50% 40%,#000 0%,transparent 78%)}
    .card{position:relative;z-index:1;width:100%;max-width:430px;border-radius:26px;
        padding:32px 26px 28px;text-align:center;
        background:var(--glass);border:1px solid var(--stroke);
        -webkit-backdrop-filter:blur(22px) saturate(160%);
        backdrop-filter:blur(22px) saturate(160%);
        box-shadow:0 30px 70px -24px rgba(0,0,0,.85), inset 0 1px 0 rgba(255,255,255,.22)}
    .mark{width:48px;height:48px;margin:0 auto 16px;border-radius:14px;display:flex;align-items:center;justify-content:center;
        background:linear-gradient(150deg,rgba(124,194,255,.35),rgba(182,147,241,.22));
        border:1px solid rgba(255,255,255,.22);
        box-shadow:0 10px 26px -10px rgba(124,194,255,.75), inset 0 1px 0 rgba(255,255,255,.35)}
    .mark svg{width:24px;height:24px;fill:#fff}
    .ring{position:relative;width:148px;height:148px;margin:0 auto 22px}
    .ring svg{width:100%;height:100%;transform:rotate(-90deg);overflow:visible}
    .ring circle{fill:none;stroke-width:9;stroke-linecap:round}
    .ring .track{stroke:rgba(255,255,255,.08)}
    .ring .fill{stroke:url(#grad);stroke-dasharray:326.7;stroke-dashoffset:326.7;
        transition:stroke-dashoffset .6s cubic-bezier(.22,.61,.36,1);
        filter:drop-shadow(0 0 10px rgba(124,194,255,.55))}
    .ring.busy .fill{animation:pulse 1.6s ease-in-out infinite}
    @keyframes pulse{0%,100%{opacity:1}50%{opacity:.5}}
    .pct{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
        font-size:30px;font-weight:700;letter-spacing:-.03em}
    h1{font-size:20px;font-weight:700}
    .sub{color:var(--mut);font-size:13px;margin-top:6px;min-height:20px}
    .retry{display:none;margin-top:20px;width:100%;padding:14px;border-radius:16px;cursor:pointer;
        font-size:15px;font-weight:700;color:#fff;
        border:1px solid rgba(124,194,255,.45);
        background:linear-gradient(180deg,rgba(124,194,255,.30),rgba(124,194,255,.10));
        box-shadow:0 12px 30px -10px rgba(124,194,255,.7), inset 0 1px 0 rgba(255,255,255,.28)}
    .retry:hover{background:linear-gradient(180deg,rgba(124,194,255,.42),rgba(124,194,255,.16))}
    .dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--acc);
        margin-right:9px;vertical-align:middle;animation:blink 1.2s infinite}
    @keyframes blink{0%,100%{opacity:.25}50%{opacity:1}}
    /* larger sizing for TV viewing */
    body{font-size:19px}
    .card{max-width:520px;padding:40px 34px 34px;border-radius:30px}
    .mark{width:64px;height:64px;border-radius:18px;margin-bottom:20px}
    .mark svg{width:32px;height:32px}
    .ring{width:184px;height:184px;margin-bottom:26px}
    .pct{font-size:38px}
    h1{font-size:26px}
    .sub{font-size:16px;margin-top:8px}
    .retry{font-size:17px;padding:18px;border-radius:18px;margin-top:24px}
</style>
</head>
<body>
<div class="aurora"></div>
<div class="grid"></div>

<div class="card">
    <div class="mark"><svg viewBox="0 0 24 24"><path d="M5 2h5v14h9v6H5z"/></svg></div>
    <div class="ring busy" id="ringBox">
        <svg viewBox="0 0 120 120">
            <defs>
                <linearGradient id="grad" x1="0" y1="0" x2="1" y2="1">
                    <stop offset="0%" stop-color="#7cc2ff"/>
                    <stop offset="100%" stop-color="#b693f1"/>
                </linearGradient>
            </defs>
            <circle class="track" cx="60" cy="60" r="52"/>
            <circle class="fill" id="ring" cx="60" cy="60" r="52"/>
        </svg>
        <div class="pct" id="pct">0%</div>
    </div>
    <h1 id="title"><span class="dot"></span>Preparing</h1>
    <p class="sub" id="sub">Installing the offline cache&hellip;</p>
    <button class="retry" id="retry" onclick="location.reload()">Try again</button>
</div>

<script>
(function () {
    var C = 2 * Math.PI * 52;
    var ring = document.getElementById("ring");
    var pct  = document.getElementById("pct");
    var box  = document.getElementById("ringBox");
    var title = document.getElementById("title");
    var sub  = document.getElementById("sub");
    var retry = document.getElementById("retry");
    var ac = window.applicationCache;

    ring.style.strokeDasharray = C;
    ring.style.strokeDashoffset = C;

    function setProgress(p) {
        p = Math.max(0, Math.min(100, Math.round(p)));
        ring.style.strokeDashoffset = C * (1 - p / 100);
        pct.textContent = p + "%";
    }
    function setText(t, s) { title.innerHTML = t; sub.textContent = s; }
    function done() { box.classList.remove("busy"); setProgress(100); }

    if (!ac) { setText("Not supported", "This browser cannot install the offline cache."); return; }

    ac.ondownloading = function () {
        box.classList.add("busy");
        setText('<span class="dot"></span>Preparing', "Installing the offline cache\u2026");
        localStorage.is755BCached = false;
    };
    ac.onprogress = function (e) { if (e && e.total) setProgress(100 * e.loaded / e.total); };
    ac.oncached = function () {
        done();
        setText("Cache ready", "Loading the exploit\u2026");
        localStorage.is755BCached = true;
        setTimeout(function () { location.reload(); }, 1200);
    };
    ac.onupdateready = function () {
        done();
        setText("Cache updated", "Loading the exploit\u2026");
        localStorage.is755BCached = true;
        setTimeout(function () { location.reload(); }, 1200);
    };
    ac.onnoupdate = function () { location.replace("index.html"); };
    ac.onerror = function () {
        box.classList.remove("busy");
        setText("Cache error", "Clear the browser data and open the host again.");
        retry.style.display = "block";
    };

    if (ac.status == 2) localStorage.is755BCached = true;

    var idle = 0, idleTimer = setInterval(function () {
        idle = (idle + 1) % 100;
        if (ring.style.strokeDashoffset === String(C)) setProgress(idle * 0.6);
    }, 60);
    setTimeout(function () { clearInterval(idleTimer); }, 2500);
})();
</script>
</body>
</html>
