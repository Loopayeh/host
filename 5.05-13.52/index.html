        <script>
        (function () {
            var msgsEl = document.getElementById("msgs");
            var stEl = document.getElementById("status");
            var stTxt = document.getElementById("statusText");
            var chip = document.getElementById("fwchip");
            var last = null;

            var m = (navigator.userAgent.match(/PlayStation 4[ /]([\d.]+)/i) || [])[1];
            chip.textContent = m ? ("PS4 \u00b7 firmware " + m) : "Not a PS4";

            function classify(t) {
                t = (t || "").toLowerCase();
                if (t.indexOf("unsupported") > -1) return ["err", "Unsupported firmware"];
                if (t.indexOf("cache not found") > -1) return ["err", "Cache not found"];
                if (t.indexOf("only for") > -1) return ["warn", "PS4 only"];
                if (t.indexOf("failed") > -1 || t.indexOf("error") > -1) return ["err", "Not jailbroken"];
                if (t.indexOf("already") > -1) return ["ok", "Already jailbroken"];
                if (t.indexOf("loaded") > -1 || t.indexOf("succeeded") > -1) return ["ok", "Jailbroken"];
                return ["busy", "Jailbreaking\u2026"];
            }
            function apply() {
                var res = classify(msgsEl.textContent);
                var key = res[0] + "|" + res[1];
                if (key === last) return;
                last = key;
                stEl.className = "status " + res[0];
                stTxt.textContent = res[1];
            }
            if (window.MutationObserver) {
                new MutationObserver(apply).observe(msgsEl, { childList: true, characterData: true, subtree: true });
            }
            setInterval(apply, 400);
            apply();
        })();
