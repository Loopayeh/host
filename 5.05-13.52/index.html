<html lang="ar" dir="rtl">
    <head>
        <meta charset='utf-8'>
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>PS4 Jailbreak · 5.05 – 13.52</title>
        <link rel="stylesheet" href="includes/style.css">
        <script>
            var uaFull = navigator.userAgent;
            var match = uaFull.match(/PlayStation 4[ /]([\d.]+)/i);
            var isPS4 = match !== null;
            var fwVersion = isPS4 ? match[1] : "Unknown";
            var fwNum = parseFloat(fwVersion);

            function onScriptError() {
                msgs.innerHTML = "کش یافت نشد.... لطفا کلیر کش کنید و از ابتدا هاست را وارد کنید.";
            }

            if (!isPS4) {
                document.addEventListener("DOMContentLoaded", () => {
                    msgs.innerHTML = "فقط برای PS4 های با فریمور های 5.05 تا 13.52";
                });
				} else {
					if (window.applicationCache.status == '0') {
						if (fwNum == 5.05 || fwNum == 5.07) {
							window.location.replace("cache505.html");
						} else if (fwNum >= 6.70 && fwNum <= 6.72) {
							window.location.replace("cache700.html");
						} else if (fwNum >= 7.00 && fwNum <= 8.52) {
							window.location.replace("cache700.html");
						} else if (fwNum >= 9.00 && fwNum <= 9.60) {
							window.location.replace("cache900.html");
						} else if (fwNum >= 10.00 && fwNum <= 11.02) {
							window.location.replace("cachecss.html");
						} else if (fwNum >= 11.50 && fwNum <= 13.52) {
							window.location.replace("cacheslopkit.html");
						} else {
							document.addEventListener("DOMContentLoaded", () => {
								msgs.innerHTML = 'Unsupported Firmware: <span style="color: red;">' + fwVersion + '</span>';
							});
						}
                } else {
                    if (fwNum == 5.05 || fwNum == 5.07) {
                        var script = document.createElement('script');
                        script.src = "505/exploit.js";
                        script.onerror = onScriptError;
                        document.head.appendChild(script);
                    }
                    else if (fwNum >= 6.70 && fwNum <= 6.72) {
                        var script = document.createElement('script');
                        script.src = "672/672entrypoint.js";
                        script.onerror = onScriptError;
                        script.onload = function () {
                            var mainScript = document.createElement('script');
                            mainScript.src = "672/main.js";
                            mainScript.onerror = onScriptError;
                            mainScript.onload = function () {
                                setTimeout(function () {
                                    if (typeof doJailBreak === "function") {
                                        doJailBreak();
                                    }
                                }, 500);
                            };
                            document.head.appendChild(mainScript);
                        };
                        document.head.appendChild(script);
                    }
                    else if (fwNum >= 7.00 && fwNum <= 8.52) {
                        var script = document.createElement('script');
                        script.type = 'module';
                        script.src = "700/alert.js";
                        script.onerror = onScriptError;
                        document.head.appendChild(script);
                    }
                    else if (fwNum >= 9.00 && fwNum <= 9.60) {
                        var script = document.createElement('script');
                        script.type = 'module';
                        script.src = "900/alert.js";
                        script.onerror = onScriptError;
                        document.head.appendChild(script);
                    }
                    else if (fwNum >= 10.00 && fwNum <= 11.02) {
                        var script = document.createElement('script');
                        script.src = "css/main.js";
                        script.onerror = onScriptError;
                        script.onload = function () {
                            setTimeout(function () {
                                doJb();
                            }, 500);
                        };
                        document.head.appendChild(script);
                    }
                    else if (fwNum >= 11.50 && fwNum <= 12.02) {
                        var script = document.createElement('script');
                        script.type = 'module';
                        script.src = "slopkit/chain_lapse.js";
                        script.onerror = onScriptError;
                        document.head.appendChild(script);
                    }
                    else if (fwNum >= 12.50 && fwNum <= 13.00) {
                        var script = document.createElement('script');
                        script.type = 'module';
                        script.src = "slopkit/chain_poops.js";
                        script.onerror = onScriptError;
                        document.head.appendChild(script);
                    }
                    else if (fwNum >= 13.02 && fwNum <= 13.52) {
                        var script = document.createElement('script');
                        script.type = 'module';
                        script.src = "slopkit/jb.js?v=19";
                        script.onerror = onScriptError;
                        document.head.appendChild(script);
                    }
                }
            }
        </script>
        <style>
            :root{--txt:#f1f3f8;--mut:#9aa3b5;--acc:#91c8f6}
            *{box-sizing:border-box;margin:0;padding:0}
            body{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px 16px;
                background:radial-gradient(1200px 620px at 50% -10%, #26303f 0%, #0f0f12 62%);
                color:var(--txt);font:16px/1.6 system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;
                direction:rtl;overflow:hidden}
            .card{width:100%;max-width:520px;border-radius:22px;padding:26px 22px;text-align:center;
                background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);
                -webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);
                box-shadow:0 24px 70px rgba(0,0,0,.5)}
            h1{font-size:20px;font-weight:600}
            .sub{color:var(--mut);font-size:13px;margin:4px 0 20px}
            #msgs{font-size:20px;font-weight:700;min-height:34px;margin:6px 0 20px}
            #console{margin-top:6px;height:150px;overflow:auto;padding:14px;border-radius:14px;
                background:rgba(0,0,0,.35);border:1px solid rgba(255,255,255,.1);direction:ltr;text-align:left;
                font:13px/1.5 ui-monospace,Menlo,Consolas,monospace;color:#cdd6e4;white-space:pre-wrap}
        </style>
    </head>
    <body>
        <div class="card">
            <h1>PS4 Jailbreak</h1>
            <p class="sub">Firmware 5.05 &ndash; 13.52</p>
            <div id="msgs">در حال جیلبریک... لطفا صبر کنید</div>
            <pre id="console">Ready. Awaiting for Jailbreaking...</pre>
        </div>
    </body>
</html>
