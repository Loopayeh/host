<!doctype html>
<html manifest="cache.manifest" lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>PS4 Jailbreak · 6.00 – 11.02</title>
<link rel="stylesheet" href="includes/style.css">
<style>
:root{--txt:#f1f3f8;--mut:#9aa3b5;--acc:#91c8f6}
*{box-sizing:border-box;margin:0;padding:0}
body{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px 16px;
  background:radial-gradient(1200px 620px at 50% -10%, #26303f 0%, #0f0f12 62%);
  color:var(--txt);font:16px/1.6 system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;direction:rtl}
.card{width:100%;max-width:520px;border-radius:22px;padding:26px 22px;text-align:center;
  background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);
  -webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);
  box-shadow:0 24px 70px rgba(0,0,0,.5)}
h1{font-size:20px;font-weight:600}
.sub{color:var(--mut);font-size:13px;margin:4px 0 16px}
.ua{color:var(--mut);font-size:11px;direction:ltr;margin-bottom:18px;word-break:break-all}
.opts{display:flex;gap:8px;justify-content:center;margin-bottom:14px}
.opts input{display:none}
.opts label{padding:10px 20px;border-radius:12px;cursor:pointer;font-size:14px;font-weight:600;
  border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.05);color:var(--mut)}
.opts input:checked + label{color:var(--txt);border-color:rgba(145,200,246,.6);background:rgba(145,200,246,.18)}
.auto{display:inline-flex;align-items:center;gap:8px;color:var(--mut);font-size:13px;margin-bottom:18px;cursor:pointer}
#jeilbrek{width:100%;padding:16px;border-radius:14px;cursor:pointer;transition:.2s;
  border:1px solid rgba(145,200,246,.35);color:var(--txt);font-size:17px;font-weight:600;
  background:linear-gradient(180deg,rgba(145,200,246,.22),rgba(145,200,246,.07))}
#jeilbrek:not(:disabled):hover{background:linear-gradient(180deg,rgba(145,200,246,.34),rgba(145,200,246,.12));border-color:rgba(145,200,246,.6)}
#jeilbrek:disabled{opacity:.5;cursor:not-allowed}
#console{margin-top:20px;height:160px;overflow:auto;padding:14px;border-radius:14px;
  background:rgba(0,0,0,.35);border:1px solid rgba(255,255,255,.1);direction:ltr;text-align:left;
  font:13px/1.5 ui-monospace,Menlo,Consolas,monospace;color:#cdd6e4;white-space:pre-wrap}
</style>
</head>
<body>
<div class="card">
  <h1>PS4 Jailbreak</h1>
  <p class="sub">Firmware 6.00 &ndash; 11.02 &middot; CSSFontFace</p>
  <div class="ua"><b id="UA">Running on:</b></div>

  <form id="kernel-options" class="opts">
    <input type="radio" name="kernel" id="netctrl-exploit" value="netctrl">
    <label for="netctrl-exploit">NetCtrl</label>
    <input type="radio" name="kernel" id="lapse-exploit" value="lapse">
    <label for="lapse-exploit">Lapse</label>
  </form>

  <label class="auto"><input id="autoJbInput" type="checkbox"> <span id="autoJbLabel">Auto Jailbreak</span></label>

  <button id="jeilbrek">Start Jailbreak</button>

  <pre id="console">Ready. Awaiting for Jailbreaking...</pre>
</div>
<script src="src/main.js"></script>
<script src="includes/script.js"></script>
</body>
</html>
