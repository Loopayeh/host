<title>PS4 Jailbreak · 6.00 – 11.02</title>
<link rel="stylesheet" href="includes/style.css">
<style>
:root{
  --txt:#f2f5fb;--mut:#98a2b6;--acc:#7cc2ff;--acc2:#b693f1;
  --ok:#6fe3a4;--bad:#f58b8b;--warn:#f3cf7a;
  --glass:linear-gradient(150deg,rgba(255,255,255,.11),rgba(255,255,255,.035));
  --stroke:rgba(255,255,255,.14);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{position:relative;overflow:hidden;min-height:100vh;display:flex;align-items:center;justify-content:center;
  padding:26px 16px;background:#08080c;color:var(--txt);
  font:16px/1.6 system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif}
.aurora{position:fixed;inset:0;z-index:0;pointer-events:none;
  background:
    radial-gradient(620px 420px at 12% -6%, rgba(79,142,247,.26), transparent 62%),
    radial-gradient(560px 460px at 92% 108%, rgba(139,92,246,.24), transparent 62%),
    radial-gradient(520px 520px at 78% 6%, rgba(56,189,248,.12), transparent 60%),
    radial-gradient(500px 500px at 6% 96%, rgba(236,72,153,.10), transparent 60%)}
.grid{position:fixed;inset:0;z-index:0;pointer-events:none;opacity:.22;
  background-image:linear-gradient(rgba(255,255,255,.05) 1px,transparent 1px),
                   linear-gradient(90deg,rgba(255,255,255,.05) 1px,transparent 1px);
  background-size:44px 44px;
  -webkit-mask-image:radial-gradient(circle at 50% 40%,#000 0%,transparent 78%);
  mask-image:radial-gradient(circle at 50% 40%,#000 0%,transparent 78%)}
.card{position:relative;z-index:1;width:100%;max-width:470px;border-radius:26px;
  padding:30px 26px 26px;text-align:center;
  background:var(--glass);border:1px solid var(--stroke);
  -webkit-backdrop-filter:blur(22px) saturate(160%);
  backdrop-filter:blur(22px) saturate(160%);
  box-shadow:0 26px 60px -32px rgba(0,0,0,.92), inset 0 1px 0 rgba(255,255,255,.13)}
.mark{width:52px;height:52px;margin:0 auto 14px;border-radius:15px;overflow:hidden;border:1px solid rgba(255,255,255,.16);box-shadow:0 10px 24px -16px rgba(0,0,0,.85), inset 0 1px 0 rgba(255,255,255,.18)}
.mark img{width:100%;height:100%;object-fit:cover;display:block}
h1{font-size:21px;font-weight:700}
.sub{color:var(--mut);font-size:13px;margin-top:5px}
.ua{color:#5f6b80;font-size:10px;direction:ltr;margin-top:10px;word-break:break-all;line-height:1.4}
.status{display:inline-flex;align-items:center;gap:9px;margin:16px auto 2px;padding:11px 20px;border-radius:999px;
  font-size:14px;font-weight:700;border:1px solid var(--stroke);background:rgba(255,255,255,.05);color:var(--txt);
  transition:background .3s,border-color .3s,color .3s}
.status .sdot{width:9px;height:9px;border-radius:50%;background:currentColor;flex:none}
.status.busy{color:var(--acc);border-color:rgba(124,194,255,.42);background:rgba(124,194,255,.12);box-shadow:0 8px 20px -14px rgba(0,0,0,.7)}
.status.busy .sdot{animation:blink 1.1s ease-in-out infinite}
.status.ok{color:var(--ok);border-color:rgba(111,227,164,.45);background:rgba(111,227,164,.12);box-shadow:0 8px 20px -14px rgba(0,0,0,.7)}
.status.err{color:var(--bad);border-color:rgba(245,139,139,.45);background:rgba(245,139,139,.12);box-shadow:0 8px 20px -14px rgba(0,0,0,.7)}
@keyframes blink{0%,100%{opacity:.25}50%{opacity:1}}
.opts{display:flex;gap:8px;justify-content:center;margin:18px 0 12px}
.opts input{display:none}
.opts label{padding:10px 20px;border-radius:14px;cursor:pointer;font-size:14px;font-weight:600;
  border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.05);color:var(--mut);transition:.2s}
.opts input:checked + label{color:#fff;border-color:rgba(124,194,255,.6);background:rgba(124,194,255,.18);
  box-shadow:0 8px 20px -16px rgba(0,0,0,.8)}
.auto{display:inline-flex;align-items:center;gap:8px;color:var(--mut);font-size:13px;margin-bottom:16px;cursor:pointer}
#jeilbrek{width:100%;padding:16px;border-radius:16px;cursor:pointer;transition:.2s;
  border:1px solid rgba(124,194,255,.45);color:#fff;font-size:17px;font-weight:700;
  background:linear-gradient(180deg,rgba(124,194,255,.30),rgba(124,194,255,.10));
  box-shadow:0 12px 26px -20px rgba(0,0,0,.9), inset 0 1px 0 rgba(255,255,255,.14)}
#jeilbrek:not(:disabled):hover{background:linear-gradient(180deg,rgba(124,194,255,.42),rgba(124,194,255,.16));border-color:rgba(124,194,255,.7)}
#jeilbrek:disabled{opacity:.5;cursor:not-allowed;box-shadow:none}
#console{margin-top:18px;height:150px;overflow:auto;padding:13px;border-radius:16px;direction:ltr;text-align:left;
  background:rgba(4,6,12,.55);border:1px solid rgba(255,255,255,.09);
  font:12.5px/1.55 ui-monospace,Menlo,Consolas,monospace;color:#c9d4e6;white-space:pre-wrap}
/* override the bundled legacy stylesheet */
#kernel-options label,#autoJbLabel{
  padding:10px 18px!important;background:rgba(255,255,255,.05)!important;
  border:1px solid rgba(255,255,255,.14)!important;border-radius:14px!important;
  color:var(--mut)!important;font-weight:600!important;box-shadow:none!important}
#kernel-options label:hover,#autoJbLabel:hover{background:rgba(255,255,255,.09)!important;border-color:rgba(255,255,255,.22)!important}
#netctrl-exploit:checked + label,#lapse-exploit:checked + label{
  background:rgba(124,194,255,.18)!important;border-color:rgba(124,194,255,.6)!important;color:#fff!important;
  box-shadow:0 8px 20px -16px rgba(0,0,0,.8)!important}
#autoJbInput:checked + #autoJbLabel{
  background:rgba(124,194,255,.14)!important;border-color:rgba(124,194,255,.45)!important;color:#fff!important}
#kernel-options input:focus + label,#autoJbInput:focus + #autoJbLabel{box-shadow:0 0 0 3px rgba(124,194,255,.25)!important}
#jeilbrek{height:auto!important;border:none!important}
/* larger sizing for TV viewing */
body{font-size:19px}
.card{max-width:560px;padding:38px 32px 32px;border-radius:30px}
.mark{width:70px;height:70px;border-radius:20px;margin-bottom:18px;overflow:hidden;border:1px solid rgba(255,255,255,.16)}
.mark img{width:100%;height:100%;object-fit:cover;display:block}
h1{font-size:28px}
.sub{font-size:16px;margin-top:7px}

.status .sdot{width:11px;height:11px}
.opts{gap:12px;margin:22px 0 16px}
.opts label,#kernel-options label,#autoJbLabel{padding:14px 28px!important;font-size:17px!important}
.auto{font-size:15px;margin-bottom:20px}
#jeilbrek{font-size:21px;padding:20px;border-radius:18px}
