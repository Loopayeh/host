<html manifest="../webkit.manifest">
<head>
<script>
function DLProgress(e){
	parent.ScrOverlay.style.display="block";
	Percent=(Math.round(e.loaded / e.total * 100));
	parent.cacheUPDtxt.innerHTML="Installing Offline Cache...";
	parent.CacheBar.style.width=Percent + '%';
}
function DisplayCacheProgress(){
	 parent.Loader.innerHTML='<object type="text/html" data="files/installCache2.html" style="width:265px; height:56px;"></object>';
	}
	window.applicationCache.addEventListener("progress",DLProgress,false);
	window.applicationCache.oncached=function(e){DisplayCacheProgress();};
	window.applicationCache.onupdateready=function(e){DisplayCacheProgress();};
	window.applicationCache.onerror=function(e){parent.cacheUPDtxt.innerHTML="Error Installing Webkit Cache";
};
</script>
<style id="loopayeh-theme">
:root{--bg:#171717;--card:#202020;--txt:#f1f3f8;--mut:#8b93a5;--acc:#91c8f6}
html,body{background-color:#171717!important;color:#f1f3f8!important;font-family:system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif!important}
body{text-align:center;padding:24px 16px}
h1,h2,h3{color:#f1f3f8!important;text-shadow:none!important;font-weight:600!important}
button,.btn{background:#202020!important;color:#f1f3f8!important;border:1px solid #2a2a2a!important;border-radius:12px!important;box-shadow:none!important;font-weight:600!important}
button:hover,.btn:hover{background:#262626!important;border-color:#91c8f6!important;color:#f1f3f8!important}
a{color:#91c8f6}
</style>
</head>

</html>
