<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
    <title>PS4 Host · Cache</title>
    <link rel="icon" href="./includes/assets/icons/favicon.ico">
    <link rel="stylesheet" href="./includes/css/host.css">
    <style>
        .cache-wrap{max-width:560px; margin:14vh auto 0; text-align:center}
        .cache-title{font-size:22px; font-weight:800; letter-spacing:-.01em}
        .bar-track{
            height:10px; border-radius:999px; margin:28px 0 14px; overflow:hidden;
            background:rgba(255,255,255,.06); border:1px solid var(--line);
        }
        .bar-fill{
            height:100%; width:0; border-radius:999px;
            background:linear-gradient(90deg,#6cb6ff,#a78bfa);
            transition:width .35s ease;
        }
        .cache-sub{font-size:13px; color:var(--mut); min-height:22px}
        .cache-foot{margin-top:36px; font-size:11px; letter-spacing:.12em; color:#5d6577}
        #cacheFrame{width:1px;height:1px;border:0;position:absolute;left:-9999px}
    </style>
</head>
<body>

<main class="cache-wrap">
    <div class="cache-title">Caching the host</div>
    <div class="bar-track"><div class="bar-fill" id="progressFill"></div></div>
    <div class="cache-sub" id="cacheStatus">Preparing…</div>
    <div class="cache-foot">FIRMWARE-BASED CACHE</div>
</main>

<iframe id="cacheFrame" src="about:blank"></iframe>

<script src="./includes/js/storage.js"></script>
<script src="./includes/js/testMode.js"></script>
<script src="./includes/js/firmware.js"></script>
<script>
    var fwVersion = getPs4FwVersion();
    var targetPage = getCachePage(fwVersion);

    var statusEl = document.getElementById('cacheStatus');
    var fillEl = document.getElementById('progressFill');
    var frame = document.getElementById('cacheFrame');
    var mainPageLocal = (typeof mainPage !== 'undefined') ? mainPage : './';

    window.addEventListener('message', function (event) {
        var data = event.data;
        if (!data || !data.type) return;

        if (data.type === 'CACHE_PROGRESS') {
            if (data.percent >= 0) {
                fillEl.style.width = data.percent + '%';
                statusEl.textContent = 'Downloading… ' + data.percent + '%';
            } else {
                statusEl.textContent = 'Downloading… (' + data.loaded + ' of ' + data.total + ')';
            }
        } else if (data.type === 'CACHE_COMPLETE' || data.type === 'CACHE_EXISTS') {
            fillEl.style.width = '100%';
            statusEl.textContent = (data.type === 'CACHE_EXISTS') ? 'Already cached. Loading…' : 'Done. Loading…';
            setTimeout(function () { window.location.replace(mainPageLocal); }, 1000);
        } else if (data.type === 'CACHE_CHECKING') {
            statusEl.textContent = 'Checking cache…';
        } else if (data.type === 'CACHE_DOWNLOADING') {
            statusEl.textContent = 'Caching files…';
        } else if (data.type === 'CACHE_ERROR') {
            statusEl.textContent = 'Cache error: ' + (data.reason || '?');
            setTimeout(function () { window.location.replace(mainPageLocal); }, 3000);
        }
    }, false);

    statusEl.textContent = 'Starting cache for firmware ' + (fwVersion || '?') + '…';
    frame.src = targetPage;
</script>
</body>
</html>
