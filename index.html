<!DOCTYPE html>
<html lang="en" manifest="cache.appcache">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Loopayeh</title>
<style>
:root{--bg:#101014;--card:#1b1d24;--txt:#f1f3f8;--mut:#9aa3b5;--acc:#4f8ef7;--ok:#7fd0a0;--bad:#e17b7b;--warn:#e3c878}
*{box-sizing:border-box;margin:0;padding:0}
body{background:radial-gradient(1400px 700px at 50% -10%,#232b3a 0%,var(--bg) 65%);color:var(--txt);font:20px/1.5 system-ui,"Segoe UI",sans-serif;min-height:100vh;display:flex;justify-content:center;align-items:center;padding:24px 16px}
.wrap{width:100%;max-width:520px}
.card{background:var(--card);border:1px solid #2c2f3a;border-radius:20px;padding:26px 28px;text-align:center}
.top{display:flex;align-items:center;gap:14px;text-align:left}
.top img{width:60px;height:60px;border-radius:50%;flex:none}
.top b{font-size:23px;letter-spacing:.12em}
.top small{display:block;color:var(--mut);font-size:13px;margin-top:2px}
#fw{margin-left:auto;flex:none;text-align:center;background:#24262e;border-radius:12px;padding:8px 14px;font-size:14px;color:var(--mut)}
#fw b{display:block;font-size:19px;color:var(--txt)}
#fw.ok b{color:var(--ok)}#fw.bad b{color:var(--bad)}
#state{font-size:27px;font-weight:700;margin:20px 0 4px}
#state.ok{color:var(--ok)}#state.bad{color:var(--bad)}#state.warn{color:var(--warn)}
#det{font-size:15px;color:var(--mut)}
#det b{color:var(--txt)}
#bar{height:10px;background:#24262e;border-radius:6px;margin:16px 0 4px;overflow:hidden;display:none}
#bar i{display:block;height:100%;width:0;border-radius:6px;background:linear-gradient(90deg,var(--acc),#b693f1);transition:width .3s}
#cache{font-size:14px;color:var(--mut);min-height:22px}
#cache.cacheok{color:var(--ok)}
#tap{margin-top:14px;font-size:17px;font-weight:700;color:var(--warn);display:none;animation:blink 1.2s ease-in-out infinite}
@keyframes blink{50%{opacity:.4}}
.foot{color:var(--mut);font-size:13px;margin-top:14px;text-align:center}
</style>
</head>
<body>
<div class="wrap">
  <div class="card">
    <div class="top">
      <img src="logo.png" alt="">
      <div><b>LOOPAYEH</b><small>PS4 Jailbreak Host &middot; 13.02 / 13.04 / 13.50</small></div>
      <div id="fw">firmware<b id="fwv">...</b></div>
    </div>
    <div id="state">detecting firmware...</div>
    <div id="det"></div>
    <div id="bar"><i id="fill"></i></div>
    <div id="cache"></div>
    <div id="tap">press &#10005; or tap to continue</div>
  </div>
  <div class="foot">GoldHEN v2.4b18.12 &middot; tip: when this page waits, press &#10005; on the controller (or tap)</div>
</div>

<script>
(function () {
    var stateEl = document.getElementById("state");
    var detEl = document.getElementById("det");
    var cacheEl = document.getElementById("cache");
    var fwBox = document.getElementById("fw");
    var fwv = document.getElementById("fwv");
    var bar = document.getElementById("bar");
    var fill = document.getElementById("fill");
    var tap = document.getElementById("tap");
    function setState(t, c) { stateEl.textContent = t; stateEl.className = c || ""; }
    function setCache(t, ok) { cacheEl.textContent = t; cacheEl.className = ok ? "cacheok" : ""; }
    function setFw(key, ok) { fwv.textContent = key || "unknown"; fwBox.className = ok ? "ok" : "bad"; }
    function setProgress(p) {
        if (p === null) { bar.style.display = "none"; return; }
        bar.style.display = "block";
        fill.style.width = Math.max(0, Math.min(100, p)) + "%";
    }
    var params = new URLSearchParams(location.search);

    // Firmwares GoldHEN v2.4b18.12 supports. jb.js still runs its own
    // kernel-table-present gate, so this is UX only -- an unlisted firmware
    // can still be launched with a tap. KEEP IN SYNC with ps4_offsets.js.
    // The PS4 reports its minor as two hex digits in the UA (13.50 -> minor 0x50).
    var SUPPORTED = { 1302: 1, 1304: 1, 1350: 1 }; // 13.02, 13.04, 13.50

    var key = null, fwnum = null;
    var m = /PlayStation\s+4[\/ ](\d+)\.(\d+)/.exec(navigator.userAgent);
    if (m) {
        var ms = parseInt(m[2], 16).toString(16);
        if (ms.length < 2) ms = "0" + ms;
        key = m[1] + "." + ms;
        fwnum = parseInt(m[1], 10) * 100 + parseInt(ms, 10);
    }

    var forced = params.get("force") === "1";
    var supported = forced || (fwnum !== null && SUPPORTED[fwnum] === 1);
    setFw(key, supported);
    detEl.innerHTML = "firmware <b>" + (key || "unknown") + "</b>"
        + (supported ? " &middot; <b>supported</b>"
                     : " &middot; not in this build");

    var target = "jb.html" + location.search;
    function go() { setState("loading jailbreak...", "warn"); location.replace(target); }

    function waitForTap(msg, action) {
        setState(msg, "warn");
        tap.style.display = "block";
        function fire() {
            tap.style.display = "none";
            window.removeEventListener("click", fire);
            window.removeEventListener("keydown", fire);
            action();
        }
        window.addEventListener("click", fire);
        window.addEventListener("keydown", fire);
    }

    // Off-target consoles are not launched automatically -- one tap still runs
    // it, so a user-agent quirk can never lock a console out.
    if (!supported) {
        setState("UNSUPPORTED FIRMWARE", "bad");
        waitForTap("UNSUPPORTED (" + (key || "unknown") + ") -- press X or tap to run anyway", go);
        return;
    }

    var ac = window.applicationCache;
    if (!ac || !document.documentElement.hasAttribute("manifest")) {
        go();
    } else if (!navigator.onLine) {
        setCache("offline -- running from cache", true);
        go();
    } else if (ac.status === ac.IDLE) {
        setCache("cached -- offline ready, internet can stay disconnected", true);
        go();
    } else if (ac.status === ac.UPDATEREADY) {
        try { ac.swapCache(); } catch (e) {}
        setCache("update downloaded -- you can disconnect the internet now", true);
        waitForTap("UPDATE READY -- press X or tap to reload & run",
                   function () { location.reload(); });
    } else {
        setCache("checking cache...");
        ac.addEventListener("downloading",
            function () { setProgress(0); setCache("caching for offline (first run)..."); }, false);
        ac.addEventListener("progress", function (e) {
            if (e && e.total) {
                var p = Math.round((e.loaded / e.total) * 100);
                setProgress(p);
                setCache("caching " + p + "% -- first run only...");
            }
        }, false);
        ac.addEventListener("cached", function () {
            setProgress(100);
            setCache("cached for offline use -- you can disconnect the internet now", true);
            waitForTap("CACHED (first run) -- press X or tap to run", go);
        }, false);
        ac.addEventListener("updateready", function () {
            try { ac.swapCache(); } catch (e) {}
            setCache("update downloaded -- you can disconnect the internet now", true);
            waitForTap("UPDATE READY -- press X or tap to reload & run",
                       function () { location.reload(); });
        }, false);
        ac.addEventListener("noupdate", function () {
            setCache("cached -- offline ready, internet can stay disconnected", true);
            go();
        }, false);
        ac.addEventListener("error", function () {
            setCache("cache unavailable");
            waitForTap("CACHE FAILED -- press X or tap to run anyway", go);
        }, false);
        ac.addEventListener("obsolete", function () {
            setCache("cache obsolete");
            waitForTap("CACHE OBSOLETE -- press X or tap to run", go);
        }, false);
    }
})();
</script>
</body>
</html>
