:root{
  --txt:#f2f5fb;--mut:#98a2b6;--acc:#7cc2ff;--acc2:#b693f1;

  --stroke:rgba(255,255,255,.13);
  --sh-card:0 26px 60px -32px rgba(0,0,0,.92), inset 0 1px 0 rgba(255,255,255,.13);
  --sh-btn:0 12px 26px -20px rgba(0,0,0,.9), inset 0 1px 0 rgba(255,255,255,.13);
  --sh-btn-h:0 18px 38px -22px rgba(0,0,0,.95), inset 0 1px 0 rgba(255,255,255,.18);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{position:relative;overflow-x:hidden;min-height:100vh;display:flex;align-items:center;justify-content:center;
  padding:36px 18px;background:#08080c;color:var(--txt);
  font:19px/1.6 system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif}
.aurora{position:fixed;inset:0;z-index:0;pointer-events:none;
  background:
    radial-gradient(760px 520px at 12% -6%, rgba(79,142,247,.26), transparent 62%),
    radial-gradient(700px 560px at 92% 108%, rgba(139,92,246,.24), transparent 62%),
    radial-gradient(640px 640px at 78% 6%, rgba(56,189,248,.12), transparent 60%),
    radial-gradient(600px 600px at 6% 96%, rgba(236,72,153,.10), transparent 60%)}
.grid{position:fixed;inset:0;z-index:0;pointer-events:none;opacity:.22;
  background-image:linear-gradient(rgba(255,255,255,.05) 1px,transparent 1px),
                   linear-gradient(90deg,rgba(255,255,255,.05) 1px,transparent 1px);
  background-size:52px 52px;
  -webkit-mask-image:radial-gradient(circle at 50% 40%,#000 0%,transparent 78%);
  mask-image:radial-gradient(circle at 50% 40%,#000 0%,transparent 78%)}
.wrap{position:relative;z-index:1;width:100%;max-width:600px}
.card{border-radius:32px;padding:40px 34px 34px;text-align:center;
  background:var(--glass);border:1px solid var(--stroke);
  -webkit-backdrop-filter:blur(24px) saturate(150%);
  backdrop-filter:blur(24px) saturate(150%);
  box-shadow:var(--sh-card)}
.mark{width:76px;height:76px;margin:0 auto 20px;border-radius:22px;overflow:hidden;
  border:1px solid rgba(255,255,255,.16);
  box-shadow:0 10px 24px -16px rgba(0,0,0,.85), inset 0 1px 0 rgba(255,255,255,.18)}
.mark img{width:100%;height:100%;object-fit:cover;display:block}
h1{font-size:36px;font-weight:800;letter-spacing:-.01em}
.sub{color:var(--mut);font-size:17px;margin-top:8px}
.list{margin-top:30px;display:flex;flex-direction:column;gap:16px}
a.btn{display:flex;align-items:center;gap:18px;padding:22px;border-radius:20px;text-decoration:none;
  color:var(--txt);text-align:left;
  background:linear-gradient(150deg,rgba(255,255,255,.08),rgba(255,255,255,.025));
  border:1px solid rgba(255,255,255,.12);
  box-shadow:var(--sh-btn);
  transition:transform .18s ease, border-color .18s ease, box-shadow .18s ease, background .18s ease}
a.btn:hover{transform:translateY(-2px);border-color:rgba(124,194,255,.4);
  background:linear-gradient(150deg,rgba(255,255,255,.11),rgba(255,255,255,.04));
  box-shadow:var(--sh-btn-h)}
a.btn .ico{width:64px;height:64px;flex:none;border-radius:18px;display:flex;align-items:center;justify-content:center;
  font-size:16px;font-weight:800;letter-spacing:.01em;color:#dbe7f7;
  background:linear-gradient(150deg,rgba(255,255,255,.10),rgba(255,255,255,.03));
  border:1px solid rgba(255,255,255,.14);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.16)}
a.btn .lbl b{display:block;font-size:22px;font-weight:700}
a.btn .lbl small{display:block;color:var(--mut);font-size:15px;margin-top:2px}
.foot{color:var(--mut);font-size:14px;margin-top:30px}
</style>
