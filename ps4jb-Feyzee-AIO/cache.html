<html manifest="ps4jb.manifest">
  <head>
    <meta charset="utf-8">
    <title>PS4 Jailbreak · 5.05 – 9.60</title>
    <style>
      :root{--txt:#f1f3f8;--mut:#9aa3b5;--acc:#91c8f6}
      *{box-sizing:border-box;margin:0;padding:0}
      body{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px 16px;
        background:radial-gradient(1200px 620px at 50% -10%, #26303f 0%, #0f0f12 62%);
        color:var(--txt);font:16px/1.6 system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif}
      .card{width:100%;max-width:520px;border-radius:22px;padding:26px 22px;
        background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);
        -webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);
        box-shadow:0 24px 70px rgba(0,0,0,.5)}
      h1{font-size:20px;font-weight:600;text-align:center}
      .sub{color:var(--mut);font-size:13px;text-align:center;margin:4px 0 22px}
      .actions{display:flex;flex-direction:column;gap:14px;align-items:center}
      #jailbreakBtn{width:100%;padding:16px;border-radius:14px;cursor:not-allowed;
        border:1px solid rgba(255,255,255,.12);color:var(--mut);font-size:17px;font-weight:600;
        background:rgba(255,255,255,.05)}
      .auto{display:flex;align-items:center;gap:8px;color:var(--mut);font-size:13px}
      #console{margin-top:20px;height:200px;overflow:auto;padding:14px;border-radius:14px;
        background:rgba(0,0,0,.35);border:1px solid rgba(255,255,255,.1);
        font:13px/1.5 ui-monospace,Menlo,Consolas,monospace;color:#cdd6e4;white-space:pre-wrap;text-align:left}
    </style>
  </head>
  <body>
    <div class="card">
      <h1>PS4 Jailbreak</h1>
      <p class="sub">Firmware 5.05 &ndash; 9.60 &middot; caching&hellip;</p>
      <div class="actions">
        <button id="jailbreakBtn" disabled>Start Jailbreak</button>
        <label class="auto"><input type="checkbox" id="autoRunCheck" disabled> Autorun disabled</label>
      </div>
      <pre id="console"></pre>
    </div>
  <script>
    // Clear history and prevent back navigation
    history.replaceState(null, null, 'index.html');
    var histlength = history.length;
    history.go(-histlength);
    // Logging utility
    var outputConsole = document.getElementById("console");
    window.log = function (msg) {
      outputConsole.textContent += msg + "\n";
    };
    // Download progress (% display)
    function DLProgress(e) {
      if (!e || !e.total) return;
      var percent = (Math.round((e.loaded / e.total) * 100));
      window.log("[CACHE] Downloading... " + percent + "% complete.");
    }
    // On cache complete
    function DisplayCacheProgress() {
      window.log(" ");
      window.log("[SUCCESS] Cache installed successfully.");
      window.log("Page will reload in 3 seconds...");
      // Delay to show success message before navigation
      setTimeout(function() { window.log("Reloading..."); }, 2000);
      // Navigate back to index.html to load the exploit from cache
      setTimeout(function() { location.reload(); }, 3000);
    }
    // On error
    function DLError(e) {
      window.log(" ");
      window.log("[CACHE ERROR] An error occured during Cache...");
      window.log("[CACHE ERROR] Check if payload.bin file included in the directory!!!");
    }
    // Event listeners
    window.applicationCache.addEventListener("progress", DLProgress, false);
    window.applicationCache.addEventListener("error", DLError, false);
    window.applicationCache.oncached = function(e) { DisplayCacheProgress(); };
    window.applicationCache.onupdateready = function(e) { DisplayCacheProgress(); };
    // Initialization message on DOM load
    document.addEventListener('DOMContentLoaded', function () {
      outputConsole.textContent = ""; // Clear console log
      window.log("AppCache download initiating...");
      window.log("Please wait, this may take a few seconds.");
    });
  </script>
  </body>
</html>
