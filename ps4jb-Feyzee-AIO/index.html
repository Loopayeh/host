  <script>
  (function () {
    var c = document.getElementById("console");
    var st = document.getElementById("status");
    var tx = document.getElementById("statusText");
    var last = null;
    function classify(t) {
      t = (t || "").toLowerCase();
      if (t.indexOf("failed") > -1 || t.indexOf("error") > -1 || t.indexOf("not implemented") > -1) return ["err", "Not jailbroken"];
      if (t.indexOf("already jailbroken") > -1) return ["ok", "Already jailbroken"];
      if (t.indexOf("homebrew enabler loaded") > -1 || t.indexOf("kernel exploit succeeded") > -1) return ["ok", "Jailbroken"];
      if (t.indexOf("starting") > -1 || t.indexOf("exploit") > -1) return ["busy", "Jailbreaking\u2026"];
      return ["busy", "Ready"];
    }
    function apply() {
      var r = classify(c.textContent), k = r[0] + r[1];
      if (k === last) return;
      last = k;
      st.className = "status " + r[0];
      tx.textContent = r[1];
    }
